aid: play-ht
url: https://raw.githubusercontent.com/api-evangelist/play-ht/refs/heads/main/apis.yml
name: PlayHT
kind: company
description: >-
  PlayHT is an AI voice generation and TTS platform with hundreds of voices, voice cloning,
  and a realtime conversational voice API (Play 3.0 mini, PlayDialog). The PlayHT REST API
  exposes voice synthesis, voice cloning, streaming, and language translation. Documentation
  is at https://docs.play.ht/.
