description: >-
  FOCUS-aligned FinOps view of PlayHT. PlayHT bills as monthly subscription tiers with
  bundled word allowances (5K / 600K / unlimited). API access requires Enterprise tier.
  Effective per-character cost depends on plan tier and actual usage.
notes: Plan-tier sizing is the dominant FinOps lever; calculate effective per-word cost vs alternatives at expected monthly volume.
