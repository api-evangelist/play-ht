meters:
- name: words_synthesized
  description: Words sent to TTS synthesis (drawn down from monthly allowance).
  unit: word
  aggregation: sum
  dimensions:
  - account
  - voice
- name: subscription_seats
  description: PlayHT subscription seats per plan tier.
  unit: seat
  aggregation: max
  dimensions:
  - account
  - plan
- name: voice_clones
  description: Voice clone count under enterprise plans.
  unit: clone
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track word burn against monthly plan allowance in PlayHT studio.
- name: Allocation
  description: Tag voices and integrations to consuming business units.
- name: Optimization
  description: Move to Premium when Professional 600K/month is consistently exceeded; negotiate Enterprise for production API.
- name: Accountability
  description: Assign owner per plan and per integration consuming TTS.
